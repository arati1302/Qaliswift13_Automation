# QualiSwift Playwright suite — Orange HRM PIM
#
# Required secret:
#   BASE_URL — Orange HRM staging base URL

name: QualiSwift Playwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      grep:
        description: "Only run tests matching this title"
        required: false
        default: ""

concurrency:
  group: qualiswift-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run QualiSwift suite
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CI: "true"
        run: |
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            npx playwright test --grep "${{ github.event.inputs.grep }}"
          else
            npx playwright test
          fi

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (traces, screenshots, videos)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
